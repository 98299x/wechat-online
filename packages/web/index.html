<body class="m-0 p-0">
  <div id="login-wrap">
    <div class="login-card">
      <h2>🔐访问验证</h2>
      <div class="item">
        <input id="inp-user" type="text" placeholder="账号">
      </div>
      <div class="item">
        <input id="inp-pass" type="password" placeholder="密码">
      </div>
      <div class="err" id="tip"></div>
      <button id="btn-login">登录</button>
    </div>
  </div>

  <div id="root"></div>

  <script type="module">
    const LOGIN_USER = import.meta.env.VITE_LOGIN_USER;
    const LOGIN_PASS = import.meta.env.VITE_LOGIN_PASS;

    const loginWrap = document.getElementById('login-wrap');
    const root = document.getElementById('root');
    const inpUser = document.getElementById('inp-user');
    const inpPass = document.getElementById('inp-pass');
    const btnLogin = document.getElementById('btn-login');
    const tip = document.getElementById('tip');

    function enterApp(){
      loginWrap.style.display = 'none';
      root.style.display = 'block';
      import('/src/main.tsx');
    }

    if(localStorage.getItem("wechat_online_auth") === "ok"){
      enterApp();
    }

    function doLogin(){
      tip.textContent = '';
      const u = inpUser.value.trim();
      const p = inpPass.value.trim();
      if(u === LOGIN_USER && p === LOGIN_PASS){
        localStorage.setItem("wechat_online_auth","ok");
        enterApp();
      }else{
        tip.textContent = "账号或密码错误";
      }
    }

    btnLogin.addEventListener('click', doLogin);
    inpPass.addEventListener('keydown',e=>{
      if(e.key === 'Enter') doLogin();
    });
  </script>
</body>
